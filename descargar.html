<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Descarga SensoLab</title>
    <style>
        :root {
            --primary: #f40;
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --text: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -1px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
            margin: 15px 0 25px;
        }
        .download-btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 68, 0, 0.3);
        }
        .download-btn:active {
            transform: scale(0.96);
        }
        .instructions {
            margin-top: 30px;
            text-align: left;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            font-size: 12px;
        }
        .instructions h3 {
            margin-top: 0;
            font-size: 14px;
            color: var(--primary);
        }
        .instructions ul {
            padding-left: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🧭</div>
        <h1>SensoLab</h1>
        <p>Portal de herramientas de precisión y sensores para Android.</p>
        
        <a href="/SensoLab_DEBUG.apk" class="download-btn">Descargar APK</a>

        <div class="instructions">
            <h3>Instrucciones:</h3>
            <ul>
                <li>Debes estar conectado a <b>Tailscale</b> en este móvil.</li>
                <li>Al instalar, permite "Fuentes desconocidas" si Android lo solicita.</li>
                <li>Acepta los permisos de <b>Cámara</b> al abrir la app.</li>
            </ul>
        </div>
    </div>

</body>
</html>
