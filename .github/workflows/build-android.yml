name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable (android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: ./src-tauri
          mobile: android
          args: --apk

      - name: Sign APK
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          APK_KEY_PASS: ${{ secrets.APK_KEY_PASS }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euxo pipefail
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          test -n "$UNSIGNED" || { echo "unsigned apk not found"; exit 1; }
          echo "unsigned apk: $UNSIGNED"
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "$APK_KEYSTORE_BASE64" | base64 -d > /tmp/apksign.jks
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/apksign.jks \
            --ks-pass "env:APK_KEYSTORE_PASS" \
            --key-pass "env:APK_KEY_PASS" \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --out src-tauri/gen/android/app/build/outputs/apk/SensoLab-release.apk \
            /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs src-tauri/gen/android/app/build/outputs/apk/SensoLab-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SensoLab-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7