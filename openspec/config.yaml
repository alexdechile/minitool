schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  SensoLab is a mobile-first Tauri v2 desktop/mobile app: a pocket toolkit of
  sensor tools (color lens, decibel meter, surveyor, seismograph, lux meter and
  photo assistant). Frontend is React 19 + TypeScript + Vite (npm). Backend is
  Rust (src-tauri, Cargo workspace) with Tauri plugins (fs, opener, share,
  sharekit). Views live in src/views/*.tsx and routing is a simple state switch
  in src/App.tsx. UI is iOS-style with Glassmorphism (src/App.css). The app is
  also built for Android via `tauri android build` (APK). Build with `npm run
  build`. No test suite yet.

